name: Verify

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker compose build app
      - run: docker compose up -d --wait
      - run: docker compose exec -T app pnpm experiment:verify
      - run: docker compose exec -T app /opt/runner/bin/python -m pytest runner/tests -q
      - run: docker compose exec -T app pnpm exec tsx scripts/container-smoke.ts
      - run: docker compose restart app
      - run: docker compose up -d --wait
      - run: docker compose exec -T app node -e "fetch('http://127.0.0.1:4310/api/health').then(r=>{if(!r.ok)process.exit(1)})"
      - if: always()
        run: docker compose logs && docker compose down
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
  cpu-experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm experiment:setup --cpu
      - run: pnpm experiment:verify
      - run: ~/.local/share/llm-zero-to-one/venv/bin/python -m pytest runner/tests -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: real-cpu-evidence
          path: .local/validation/cpu.json
